name: Talaria quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    env:
      _TESTING_TALARIA_SKIP_MODEL_BENCH: '1'
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install uv==0.11.23
      - run: uv sync --locked --extra dev --python "${{ matrix.python-version }}"
      - run: uv run --extra dev pytest
      - run: uv build
      - name: Install development-only OpenSpec CLI
        run: npm install --prefix "$RUNNER_TEMP/openspec" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @fission-ai/openspec@1.15.0
      - name: Validate native OpenSpec artifacts
        run: |
          test "$("$RUNNER_TEMP/openspec/node_modules/.bin/openspec" --version)" = '1.15.0'
          "$RUNNER_TEMP/openspec/node_modules/.bin/openspec" validate --all --strict
      - run: node scripts/check-openspec.mjs
      - run: node --test tests/records/*.test.mjs
